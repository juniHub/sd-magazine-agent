name: Monthly SD Family digest

on: { schedule: [{ cron: "0 15 1 * *" }, { cron: "0 15 15 * *" }], workflow_dispatch: {} }

permissions: { contents: write, models: read, issues: write, pages: write }

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - run: python sdfm_agent.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save digest
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digests issues
          git commit -m "Add monthly digest" || echo "Nothing to commit"
          git push
      - name: Rebuild site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
      - name: Email me via GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="SD Family digest $(date +'%B %Y')"
          FILE="digests/$(date +%Y-%m).md"
          if grep -q "not found yet" "$FILE"; then echo "Issue not posted yet; skipping"; exit 0; fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          SITE="https://$OWNER.github.io/${{ github.event.repository.name }}/"
          { echo "🌐 Browse this month's guide: $SITE"; echo; cat "$FILE"; } > body.md
          EXISTING=$(gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue edit "$EXISTING" --body-file body.md; echo "Updated existing issue #$EXISTING"; exit 0; fi
          gh issue create --title "$TITLE" --body-file body.md --assignee "${{ github.repository_owner }}"
